name: Offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest -v
      - run: python env_contract.py contract.example.json --env-file good.example.env
      - name: Verify failing demo exit and expected report
        run: |
          python env_contract.py contract.example.json --env-file bad.example.env --format json > actual.json && code=0 || code=$?
          test "$code" -eq 1
          diff -u expected-bad.json actual.json
